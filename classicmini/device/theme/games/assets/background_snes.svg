    </linearGradient>
    <linearGradient id="rbR" x1="0" y1="142" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a21428" stop-opacity="0.85"/><stop offset="0.17" stop-color="#a21428" stop-opacity="1"/><stop offset="0.4" stop-color="#a21428" stop-opacity="1"/><stop offset="1" stop-color="#a21428" stop-opacity="0"/>
    </linearGradient>
