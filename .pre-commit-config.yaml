# runs on the staged files before each commit; set up with "pre-commit install"
# only the NES/SNES Classic port is checked: the rest of the tree is EmulationStation itself
files: ^(classicmini/|\.github/README\.md$|\.github/workflows/build\.yml$|\.pre-commit-config\.yaml$|\.shellcheckrc$|\.gitattributes$|\.markdownlint\.yaml$)
exclude: ^(classicmini/out/|classicmini/device/theme/.*\.svg$|.*OFL.*\.txt$)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
